<script type="module">
import * as THREE from 'three';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=id=>document.getElementById(id);
const LAPS=3,W=11,N=600;
const CARS=[
 {id:'bandit',name:'Bandit 68',color:0x111111,stripe:0xd4a017,top:52,acc:21,grip:1.9,shape:'fast'},
 {id:'thunder',name:'Thunder SS',color:0xc8102e,stripe:0xffffff,top:56,acc:18,grip:1.65,shape:'long'},
 {id:'ridge',name:'Ridgeback 70',color:0x1f6fd1,stripe:0xffffff,top:49,acc:25,grip:2.15,shape:'notch'}];
const TRACKS=[
 {id:'t1',name:'Ridge Loop',ctrl:[[0,-120],[90,-120],[150,-80],[160,0],[120,60],[40,70],[0,120],[-80,130],[-150,80],[-150,-20],[-100,-100]],grass:0x3f8f3a,aiCorner:.9,aiMin:.5,aiSkill:1},
 {id:'t2',name:'Canyon Eight',ctrl:[[0,-160],[120,-160],[190,-110],[170,-30],[90,-10],[60,60],[110,130],[40,190],[-60,170],[-80,90],[-20,30],[-130,0],[-190,-70],[-140,-150]],grass:0xa8834e,aiCorner:.42,aiMin:.68,aiSkill:1.06}];
let carSel=0,trackSel=0;
// ---- menu
const bar=(v,min,max)=>`<div class="bar"><i style="width:${Math.round(20+80*(v-min)/(max-min))}%"></i></div>`;
CARS.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b><span class="sw" style="background:#${c.color.toString(16).padStart(6,'0')}"></span>${c.name}</b>Top speed${bar(c.top,47,57)}Acceleration${bar(c.acc,17,26)}Grip${bar(c.grip,1.6,2.2)}`;
 d.onclick=()=>{carSel=i;refresh()};$('cars').appendChild(d);});
TRACKS.forEach((t,i)=>{const d=document.createElement('div');d.className='card';d.style.minWidth='120px';d.onclick=()=>{trackSel=i;refresh()};$('tracks').appendChild(d);});
function refresh(){[...$('cars').children].forEach((d,i)=>d.classList.toggle('sel',i===carSel));
 [...$('tracks').children].forEach((d,i)=>{d.classList.toggle('sel',i===trackSel);const b=+localStorage.getItem('am_best_'+TRACKS[i].id)||0;d.innerHTML=`<b>${TRACKS[i].name}</b>Best: ${fmt(b)}`;});}
const fmt=t=>t?`${Math.floor(t/60)}:${(t%60).toFixed(3).padStart(6,'0')}`:'--';
// ---- renderer
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ec9ff);scene.fog=new THREE.Fog(0x8ec9ff,150,500);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,800);
scene.add(new THREE.HemisphereLight(0xffffff,0x446633,0.9));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(50,100,30);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
// ---- track
let world=null,pts=[],sAng=0;
function nearest(x,z,from,range){let best=1e9,bi=0;for(let k=0;k<range;k++){const i=((from+k)%N+N)%N;const dx=pts[i].x-x,dz=pts[i].z-z,d=dx*dx+dz*dz;if(d<best){best=d;bi=i;}}return{i:bi,d:Math.sqrt(best)};}
function disposeAll(o){o.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material){const ms=[].concat(m.material);ms.forEach(x=>{if(x.map)x.map.dispose();x.dispose();});}});}
function buildTrack(T){
 if(world){scene.remove(world);disposeAll(world);}world=new THREE.Group();scene.add(world);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshLambertMaterial({color:T.grass}));g.rotation.x=-Math.PI/2;world.add(g);
 const curve=new THREE.CatmullRomCurve3(T.ctrl.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'centripetal');
 pts=curve.getSpacedPoints(N);pts.pop();
 const pos=[],idx=[],kerb=[],ki=[],kc=[];
 for(let i=0;i<N;i++){const a=pts[i],b=pts[(i+1)%N];const t=b.clone().sub(a).normalize();const n=new THREE.Vector3(-t.z,0,t.x);a.n=n;
  pos.push(a.x+n.x*W,0.1,a.z+n.z*W,a.x-n.x*W,0.1,a.z-n.z*W);const j=i*2,k=((i+1)%N)*2;idx.push(j,k,j+1,j+1,k,k+1);
  for(const s of[1,-1]){const o=s*W;kerb.push(a.x+n.x*o,0.13,a.z+n.z*o,a.x+n.x*(o+s*1.2),0.13,a.z+n.z*(o+s*1.2));}
  const c=(Math.floor(i/4)%2)?[1,1,1]:[.85,.1,.1];for(let q=0;q<4;q++)kc.push(...c);
  for(let s=0;s<2;s++){const j2=(i*2+s)*2,k2=(((i+1)%N)*2+s)*2;ki.push(j2,k2,j2+1,j2+1,k2,k2+1);}}
 // curvature for AI speed
 for(let i=0;i<N;i++){const a=pts[i].n,b=pts[(i+12)%N].n;pts[i].curv=Math.abs(Math.atan2(a.x*b.z-a.z*b.x,a.x*b.x+a.z*b.z));}
 const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));rg.setIndex(idx);rg.computeVertexNormals();
 world.add(new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:0x3a3a3e,side:THREE.DoubleSide})));
 const kg=new THREE.BufferGeometry();kg.setAttribute('position',new THREE.Float32BufferAttribute(kerb,3));kg.setAttribute('color',new THREE.Float32BufferAttribute(kc,3));kg.setIndex(ki);
 world.add(new THREE.Mesh(kg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})));
 const st=pts[0],sd=pts[1].clone().sub(st).normalize();sAng=Math.atan2(sd.x,sd.z);
 const cv=document.createElement('canvas');cv.width=64;cv.height=8;const cx=cv.getContext('2d');for(let x=0;x<16;x++)for(let y=0;y<2;y++){cx.fillStyle=(x+y)%2?'#fff':'#111';cx.fillRect(x*4,y*4,4,4);}
 const tex=new THREE.CanvasTexture(cv);tex.magFilter=THREE.NearestFilter;
 const line=new THREE.Mesh(new THREE.PlaneGeometry(W*2,2),new THREE.MeshBasicMaterial({map:tex}));line.rotation.x=-Math.PI/2;
 const lg=new THREE.Group();lg.add(line);lg.position.set(st.x,0.15,st.z);lg.rotation.y=sAng;world.add(lg);
 const gn=new THREE.Group(),gm=new THREE.MeshLambertMaterial({color:0xdddddd});
 for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.6,7,.6),gm);p.position.set(s*(W+2),3.5,0);gn.add(p);}
 const bb=new THREE.Mesh(new THREE.BoxGeometry(W*2+4,1.2,.6),new THREE.MeshLambertMaterial({color:0xcc2222}));bb.position.y=7;gn.add(bb);gn.position.copy(lg.position);gn.rotation.y=sAng;world.add(gn);
 const tg=new THREE.ConeGeometry(3,9,6);tg.translate(0,4.5,0);const trees=new THREE.InstancedMesh(tg,new THREE.MeshLambertMaterial({color:T.id==='t2'?0x5e6b2a:0x245e2a}),160);
 const m4=new THREE.Matrix4();let tc=0,rs=7;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;
 for(let tries=0;tc<160&&tries<5000;tries++){const x=(rnd()-.5)*560,z=(rnd()-.5)*560;if(nearest(x,z,0,N).d>W+12){m4.makeTranslation(x,0,z);trees.setMatrixAt(tc++,m4);}}trees.count=tc;world.add(trees);
}
// ---- cars
function mergeParts(parts){const P=[],Nn=[],C=[];const col=new THREE.Color();
 for(const p of parts){const g=p.g.index?p.g.toNonIndexed():p.g;g.applyMatrix4(p.m);const pa=g.attributes.position.array,na=g.attributes.normal.array;col.set(p.c);
  for(let i=0;i<pa.length;i++){P.push(pa[i]);Nn.push(na[i]);}for(let i=0;i<pa.length/3;i++)C.push(col.r,col.g,col.b);g.dispose();p.g.dispose();}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(Nn,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return g;}
const VC=new THREE.MeshLambertMaterial({vertexColors:true});
function makeCar(def,color){const car=new THREE.Group();const parts=[];const o=new THREE.Object3D();
 const box=(w,h,d,x,y,z,c,rx=0)=>{o.position.set(x,y,z);o.rotation.set(rx,0,0);o.updateMatrix();parts.push({g:new THREE.BoxGeometry(w,h,d),m:o.matrix.clone(),c});};
 const body=color??def.color,st=def.stripe,blk=0x111111,gls=0x223344,chr=0xcccccc;
 const L=def.shape==='long'?4.9:4.5;
 box(2,.6,L,0,.65,0,body);
 if(def.shape==='fast'){box(1.7,.5,2.4,0,1.18,-.5,body,-.12);box(1.6,.4,.05,0,1.2,.72,gls);box(1.6,.3,.05,0,1.05,-1.75,gls);}
 else if(def.shape==='notch'){box(1.7,.55,1.7,0,1.22,-.2,body);box(1.6,.45,.05,0,1.22,.66,gls);box(1.6,.45,.05,0,1.22,-1.06,gls);box(.9,.25,1,0,1.05,1.4,blk);}
 else{box(1.75,.48,2.1,0,1.18,-.4,body);box(1.6,.4,.05,0,1.18,.66,gls);box(1.6,.4,.05,0,1.18,-1.46,gls);box(2.1,.12,.5,0,1.15,-L/2+.3,body);}
 box(.35,.62,L+.02,.35,.66,0,st);box(.35,.62,L+.02,-.35,.66,0,st);
 box(2.05,.15,.15,0,.45,L/2+.05,chr);box(2.05,.15,.15,0,.45,-L/2-.05,chr);
 for(const s of[1,-1]){box(.35,.2,.05,s*.65,.72,L/2+.02,0xffffcc);box(.4,.15,.05,s*.6,.75,-L/2-.02,0xff2200);}
 box(.35,.75,.75,1,.38,-1.45,blk);box(.35,.75,.75,-1,.38,-1.45,blk);
 car.add(new THREE.Mesh(mergeParts(parts),VC));
 car.wheels=[];for(const x of[1,-1]){const w=new THREE.Mesh(WHEEL,WM);w.position.set(x,.38,1.45);car.add(w);car.wheels.push(w);}
 scene.add(car);return car;}
const WHEEL=new THREE.BoxGeometry(.35,.75,.75),WM=new THREE.MeshLambertMaterial({color:0x111111});
function disposeCar(m){scene.remove(m);m.children[0].geometry.dispose();}
// ---- input
const keys={L:0,R:0,G:0,B:0};
for(const k of['L','R','G','B']){const el=$(k);const on=e=>{e.preventDefault();keys[k]=1;el.classList.add('on')},off=e=>{e.preventDefault();keys[k]=0;el.classList.remove('on')};
 el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false});el.addEventListener('touchcancel',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}
const km={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'G',ArrowDown:'B',a:'L',d:'R',w:'G',s:'B'};
addEventListener('keydown',e=>{if(km[e.key])keys[km[e.key]]=1});addEventListener('keyup',e=>{if(km[e.key])keys[km[e.key]]=0});
let tilt=null,oriOn=false;
function onOri(e){if(e.beta==null)return;const ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
 const t=(ang===90)?e.beta:(ang===-90||ang===270)?-e.beta:e.gamma;tilt=Math.max(-1,Math.min(1,t/25));}
// ---- race
let racers=[],player=null,state='menu',raceStart=0,countdown=0,best=0;
const NAMES=['You','Rival 1','Rival 2','Rival 3'];
function startRace(){
 const T=TRACKS[trackSel];if(free)free.mesh.visible=false;openWorld.visible=false;scene.fog.near=150;scene.fog.far=500;camera.far=800;camera.updateProjectionMatrix();document.body.classList.remove('free');hidePrompt();buildTrack(T);
 clearRace();
 const others=[0,1,2].map(i=>CARS[(carSel+1+i)%3]);const aiCol=[null,null,0x2e8b57];
 const grid=[[3,-4],[-3,-4],[3,-11],[-3,-11]];const order=[player,...others];
 [CARS[carSel],...others].forEach((def,i)=>{const p0=pts[0];const fx=Math.sin(sAng),fz=Math.cos(sAng);const [lat,back]=grid[i];
  const r={def,ai:i>0,name:NAMES[i],x:p0.x+p0.n.x*lat+fx*back,z:p0.z+p0.n.z*lat+fz*back,h:sAng,v:0,steer:0,seg:N-1,mid:false,lap:0,lapStart:0,done:0,
   skill:[1,.93,.86,.8][i]*(0.97+Math.random()*.06),lane:(Math.random()-.5)*6,mesh:makeCar(def,i===3?aiCol[2]:null)};
  r.seg=nearest(r.x,r.z,0,N).i;racers.push(r);});
 player=racers[0];best=+localStorage.getItem('am_best_'+T.id)||0;
 $('best').textContent=fmt(best);$('last').textContent='--';$('ln').textContent=1;
 $('menu').style.display='none';$('fin').style.display='none';state='count';countdown=performance.now();
 camera.position.set(player.x-Math.sin(sAng)*10,5,player.z-Math.cos(sAng)*10);}
function progress(r){return r.done?1e9-r.done:r.lap*N+((r.seg-(r.seg>N*.9&&!r.mid&&r.lap===0?N:0)));}
function crossLine(r,ps,now){
 if(r.seg>N*0.45&&r.seg<N*0.55)r.mid=true;
 if(ps>N*0.9&&r.seg<N*0.1){if(r.mid&&r.started){const lt=(now-r.lapStart)/1000;r.lap++;
   if(!r.ai){$('last').textContent=fmt(lt);if(!best||lt<best){best=lt;localStorage.setItem('am_best_'+TRACKS[trackSel].id,lt);$('best').textContent=fmt(best);flash('NEW BEST!');}else flash('LAP '+fmt(lt));
    $('ln').textContent=Math.min(LAPS,r.lap+1);}
   if(r.lap>=LAPS){r.done=(now-raceStart)/1000;if(!r.ai)finish(now);}}
  else if(!r.started)r.started=true;
  r.lapStart=now;r.mid=false;}
 else if(ps<N*0.1&&r.seg>N*0.9)r.mid=false;}
function finish(now){state='done';setTimeout(()=>{const rows=[...racers].sort((a,b)=>progress(b)-progress(a));
 let pv=0;$('fintab').innerHTML=rows.map((r,i)=>{let t;if(r.done){pv=r.done;t=fmt(r.done);}else{const left=(LAPS-r.lap)*N-((r.seg)%N);pv=Math.max(pv+0.5,(now-raceStart)/1000+left*(pts[0].distanceTo(pts[1]))/Math.max(10,r.def.top*r.skill*.8));t='~'+fmt(pv);}
  return `<tr style="${r.ai?'':'color:#ff5'}"><td>${ord(i+1)}</td><td>${r.name}</td><td>${r.def.name}</td><td>${t}</td></tr>`}).join('');
 $('fint').textContent='FINISH — '+ord(rows.indexOf(player)+1);$('fin').style.display='flex';},900);}
const ord=n=>n+(['th','st','nd','rd'][n]||'th');
function step(r,dt,now,inp){
 const n=nearest(r.x,r.z,r.seg-30,61);const off=n.d>W+0.6;
 physics(r,dt,inp,off,(off?18:r.def.top)*(r.ai?r.skill*TRACKS[trackSel].aiSkill:1));

function physics(r,dt,inp,off,maxV){const d=r.def;

 for(let t=0;bn<BN&&t<4000;t++){const x=(rnd()-.5)*320,z=(rnd()-.5)*280,w=8+rnd()*12,dd=8+rnd()*12,h=6+rnd()*22;

})();
// minimap background
const MS=130,mscale=MS/(BOUND*2+80),mx=x=>(x+BOUND+40)*mscale,mz=z=>(z+BOUND+40)*mscale;
const mbg=document.createElement('canvas');mbg.width=mbg.height=MS;{const c=mbg.getContext('2d');c.fillStyle='#3f7d33';c.fillRect(0,0,MS,MS);

const mctx=$('mini').getContext('2d');

 const p=free;mctx.save();mctx.translate(mx(p.x),mz(p.z));mctx.rotate(-p.h);mctx.fillStyle='#ff0';mctx.beginPath();mctx.moveTo(0,5);mctx.lineTo(-3.5,-4);mctx.lineTo(3.5,-4);mctx.fill();mctx.restore();}
let free=null,activeMarker=null;
function clearRace(){racers.forEach(r=>disposeCar(r.mesh));racers=[];}
function enterWorld(mk){
 clearRace();if(world){scene.remove(world);disposeAll(world);world=null;}
 openWorld.visible=true;scene.fog.near=120;scene.fog.far=430;camera.far=480;camera.updateProjectionMatrix();
 if(!free||free.def!==CARS[carSel]){if(free)disposeCar(free.mesh);free={def:CARS[carSel],x:0,z:-60,h:0,v:0,steer:0,mesh:makeCar(CARS[carSel])};}
 free.mesh.visible=true;free.v=0;free.steer=0;
 if(mk){free.x=mk.x;free.z=mk.z;mk.inside=true;mk.prompted=true;mk.t=0;}
 player=free;state='free';document.body.classList.add('free');
 $('menu').style.display='none';$('fin').style.display='none';hidePrompt();
 camera.position.set(free.x-Math.sin(free.h)*10,5,free.z-Math.cos(free.h)*10);}
function hidePrompt(){$('prompt').style.display='none';$('ring').style.display='none';activeMarker=null;}
function worldTick(dt,now){
 const kb=keys.L-keys.R;const inp={s:kb!==0?kb:(tilt!=null?-tilt:0),g:keys.G,b:keys.B};
 const rd=roadDist(free.x,free.z),off=rd>RW+.6;
 physics(free,dt,inp,off,off?(canyonDist(free.x,free.z)<45?24:28):free.def.top);
 // buildings + rocks collision approximated: buildings boxes
 for(const b of openWorld.userData.bld){const hx=b[2]/2+1.2,hz=b[3]/2+1.2,dx=free.x-b[0],dz=free.z-b[1];if(Math.abs(dx)<hx&&Math.abs(dz)<hz){const px=hx-Math.abs(dx),pz=hz-Math.abs(dz);if(px<pz)free.x+=Math.sign(dx)*px;else free.z+=Math.sign(dz)*pz;free.v*=.5;}}
 if(Math.abs(free.x)>BOUND||Math.abs(free.z)>BOUND){free.x=Math.max(-BOUND,Math.min(BOUND,free.x));free.z=Math.max(-BOUND,Math.min(BOUND,free.z));free.v*=.3;flash('Edge of the map');}

 for(const mk of MARKERS){const d=Math.hypot(free.x-mk.x,free.z-mk.z),T=TRACKS[mk.track];mk.pil.material.opacity=.22+.1*Math.sin(now/300);
  if(d<9){if(!mk.inside){mk.inside=true;mk.t=0;mk.prompted=false;}
   if(!mk.prompted){if(Math.abs(free.v)<1){mk.t+=dt;const f=Math.min(1,mk.t/5);const r=$('ring');r.style.display='flex';
      r.style.background=`conic-gradient(rgba(255,200,40,.9) ${f*360}deg,rgba(255,255,255,.15) 0)`;r.textContent=Math.ceil(5-mk.t);

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let prev=performance.now(),orbit=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-prev)/1000);prev=now;
