  for(const id of ids){const act=id===save.active;h+=`<div class="it${id===gView?' sel':''}" data-act="view" data-id="${id}"><div><b>${CAR(id).name}</b>${act?' <span style="color:#7f7">ACTIVE</span>':''}<br><span style="opacity:.7">Sell value ${money(sellValue(id))}</span></div><div>
   <button class="btn sm" data-act="use" data-id="${id}" ${act?'disabled':''}>${act?'Driving':'Drive'}</button><button class="btn sm" style="background:#555" data-act="sell" data-id="${id}" ${act||only?'disabled':''}>Sell</button></div></div>`;}
  h+=`<div style="opacity:.6;font-size:11px">Selling returns 60% of price + upgrades. You can't sell your active or last car.</div>`;}
 else if(gTab==='deal'){for(const c of CARS){const own=!!save.owned[c.id];h+=`<div class="it${c.id===gView?' sel':''}" data-act="view" data-id="${c.id}"><div><b>${c.name}</b><br><span style="opacity:.7">${money(c.price)}${c.id==='bandit'?' · starter':''}</span></div>
  <button class="btn sm" data-act="buy" data-id="${c.id}" ${own||save.cash<c.price?'disabled':''}>${own?'Owned':'Buy'}</button></div>`;}}
 else if(gTab==='upg'){const id=save.active,e=save.owned[id];h+=`<div style="margin:2px 0 4px">Upgrading: <b>${CAR(id).name}</b></div>`;
  for(const u of UPG){const l=e[u.k],cost=u.cost[l];h+=`<div class="it"><div><b>${u.name}</b> <span style="color:#f5a623">${'■'.repeat(l)}${'□'.repeat(3-l)}</span><br><span style="opacity:.7">${l>=3?'MAX':'Level '+(l+1)+' · '+money(cost)}</span></div>
   <button class="btn sm" data-act="upg" data-k="${u.k}" ${l>=3||save.cash<cost?'disabled':''}>${l>=3?'Max':'Buy'}</button></div>`;}}
 else{const id=save.active,cur=effDef(id).paint;h+=`<div style="margin:2px 0 4px">Paint <b>${CAR(id).name}</b> · ${money(PAINT_COST)} per coat</div><div>`;
  for(const p of PAINTS)h+=`<span class="sw${p===cur?' on':''}" data-act="paint" data-c="${p}" style="background:#${p.toString(16).padStart(6,'0')}"></span>`;h+='</div>';}
 $('gbody').innerHTML=h;}
function garageAct(a,el){const id=el.dataset.id;
 if(a==='view'){gView=id;}
 else if(a==='use'){if(save.owned[id]){save.active=id;gView=id;}}
 else if(a==='sell'){if(!save.owned[id]||id===save.active||Object.keys(save.owned).length<2)return;save.cash+=sellValue(id);delete save.owned[id];gView=save.active;flash('Sold '+CAR(id).name);}
 else if(a==='buy'){const c=CAR(id);if(!c||save.owned[id]||save.cash<c.price)return;save.cash-=c.price;save.owned[id]=newEntry();save.active=id;gView=id;flash('Bought '+c.name);}
 else if(a==='upg'){const e=save.owned[save.active],u=UPG.find(x=>x.k===el.dataset.k);const l=e[u.k];if(l>=3||save.cash<u.cost[l])return;save.cash-=u.cost[l];e.spent+=u.cost[l];e[u.k]=l+1;gView=save.active;}
 else if(a==='paint'){const c=+el.dataset.c,e=save.owned[save.active];if(effDef(save.active).paint===c||save.cash<PAINT_COST)return;save.cash-=PAINT_COST;e.spent+=PAINT_COST;e.paint=c;gView=save.active;}
 persist();renderGarage();}
$('garage').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){gTab=t.dataset.tab;if(gTab!=='mine'&&gTab!=='deal')gView=save.active;renderGarage();return;}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.stopPropagation();garageAct(b.dataset.act,b);});

 enterWorld();});

$('tomenu').onclick=()=>{$('fin').style.display='none';clearRace();if(world){scene.remove(world);disposeAll(world);world=null;}if(free){disposeCar(free.mesh);free=null;}player=null;hidePrompt();garageHide();document.body.classList.remove('free','racing');openWorld.visible=true;setWorldFog();updCash();$('menu').style.display='flex';state='menu';};
updCash();setWorldFog();
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let prev=performance.now(),orbit=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-prev)/1000);prev=now;
 if(state==='garage'){gAng+=dt*.5;gCam.position.set(Math.sin(gAng)*9,3.4,Math.cos(gAng)*9);gCam.lookAt(0,.8,0);
  gCam.setViewOffset(innerWidth,innerHeight,innerWidth*.28,0,innerWidth,innerHeight);renderer.render(gScene,gCam);return;}
 const DR=TRACKS[trackSel].drag&&(state==='count'||state==='race'||state==='done');if(DR)dragTick(dt,now);
 if(state==='count'&&!DR){const left=3-Math.floor((now-countdown)/1000);if(left>0){$('msg').textContent=left;$('msg').style.opacity=1;}
  else{state='race';raceStart=now;racers.forEach(r=>{r.lapStart=now;});flash('GO!');}}
 if(state==='free')worldTick(dt,now);
 if(!DR&&(state==='race'||state==='done')){
  for(const r of racers){const inp=r.ai?(r.done?{s:0,g:0,b:1}:aiInput(r)):(r.done?{s:0,g:0,b:1}:playerInput());step(r,dt,now,inp);}
  if(!TRACKS[trackSel].rally)collide();if(traffic.length&&TRACKS[trackSel].sprint){moveTraffic(dt);trafficHits();if(state==='race')$('ln').textContent=Math.max(0,(N-SPF-player.seg)*pts[0].distanceTo(pts[1])/1609).toFixed(2)+' mi left';}
  if(state==='race'){$('cur').textContent=fmt((now-player.lapStart)/1000)||'0:00.000';
   const rk=[...racers].sort((a,b)=>progress(b)-progress(a)).indexOf(player)+1;$('pos').textContent=ord(rk)+' / 4';
   if(TRACKS[trackSel].rally){$('ln').textContent=player.cp+'/'+gates.length;$('rinfo').innerHTML='<br>TIME '+(fmt((now-raceStart)/1000)||'0:00.000')+'<br>SPLIT '+(player.lastSplit?fmt(player.lastSplit)+(player.splitD==null?'':' <span style="color:'+(player.splitD>0?'#f77':'#7f7')+'">'+(player.splitD>=0?'+':'')+player.splitD.toFixed(2)+'</span>'):'--');}}
  $('spd').textContent=Math.round(Math.abs(player.v)*2.237)+' mph';}
 for(const r of (state==='free'?[free]:racers)){r.mesh.position.set(r.x,r.off?Math.sin(now/40)*.04:0,r.z);r.mesh.rotation.set(0,r.h,0);r.mesh.rotateZ(-r.steer*Math.min(1,r.v/40)*0.06);for(let i=0;i<2;i++)r.mesh.wheels[i].rotation.y=r.steer*0.4;}
 if(player){camPos.set(player.x-Math.sin(player.h)*10,4.2,player.z-Math.cos(player.h)*10);camera.position.lerp(camPos,Math.min(1,dt*5));
  camLook.set(player.x+Math.sin(player.h)*4,1.2,player.z+Math.cos(player.h)*4);camera.lookAt(camLook);}
 else{orbit+=dt*.1;camera.position.set(Math.sin(orbit)*320,120,Math.cos(orbit)*320);camera.lookAt(0,0,0);}
